name: Image

# Replaces the Prow job post-plantbuild-image-build.
on:
  push:
    branches:
      - master
    # GitHub does not apply the paths filter to tag pushes.
    tags:
      - 'v*'
    paths:
      - 'jsonnetlib/**'
      - 'entry.sh'
      - 'Dockerfile'
      - 'fmt-check.sh'
      - 'fmt-update.sh'
      - '.github/workflows/image.yaml'

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same tags that `plantbuild push` gave: the short commit hash,
      # latest for master, and the git tag name for a tag push.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/theplant/plantbuild
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # GITHUB_TOKEN can push when the package gives this repository write
      # access.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # We do not verify attestations, and they make a new image index
          # for the same content. plantbuild disables them for this reason.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
